<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="stegGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#stegGradient)" />

  <!-- Stegstr Shield Contour -->
  <path d="M50 18 L74 28 C74 52 64 68 50 78 C36 68 26 52 26 28 Z" fill="none" stroke="url(#shieldGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Hidden Stego Core / Keyhole -->
  <circle cx="50" cy="40" r="7" fill="url(#shieldGlow)" />
  <polygon points="46,45 54,45 57,62 43,62" fill="url(#shieldGlow)" />

  <!-- Subtly Embedded Binary Pixel Dots (Steganography Signal) -->
  <circle cx="34" cy="38" r="2.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="66" cy="38" r="2.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="50" cy="28" r="2.5" fill="#38BDF8" opacity="0.9"/>
</svg>
